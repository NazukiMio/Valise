# OpenClaw. Verified on ubuntu-vm (arm64) with openclaw 2026.10.9 installed
# from npm into a user-level prefix and initialised with `openclaw setup
# --baseline` (no credentials, no gateway service).
# Sources: docs.openclaw.ai pages "Secrets, storage, and logs" (S&S),
# "Agent workspace" (WS), "Gateway ports" FAQ (GP), "Logging" (LOG), and
# observation of the real install (OBS).
schema: valise-profile/1
id: openclaw
display_name: OpenClaw
profile_version: 18
status: draft
harness_versions_tested: ["2026.10.9"]
docs: https://docs.openclaw.ai
# OBS (2026-10-31, 2026.10.9, MIT): MASCOT_ART in dist/claw-banner-*.mjs
# (src/cli/claw-banner.ts), tinted with LOBSTER_PALETTE.accent from the theme.
display:
  color: "#FF5A2D"
  icon_source: "OpenClaw 2026.10.9 CLI banner (src/cli/claw-banner.ts MASCOT_ART), MIT"
  icon: |2   # explicit indentation: the art starts with a space
     •●●:.        .:●●•
    :●●●●:        :●●●●:
    .●●●●:.:•●●•:.:●●●●.
     .●●●: •●●●●• :●●●.
     ..:••●●●●●●●●••:..
    .::••••●●●●●●••••::.
     . .:  •●●●●•  :. .
        .  :●●●●:  .
          .●●●●●●.
           :••••:

detect:
  binaries: [openclaw]
  version_argv: [openclaw, --version]                                       # OBS: "OpenClaw 2026.10.9 (8b18b55)"
  state_dir_candidates: ["${env:OPENCLAW_STATE_DIR}", "${HOME}/.openclaw"]  # S&S
  markers_any: [openclaw.json]                                              # OBS + S&S
  # OpenClaw's ~ is $OPENCLAW_HOME when set; a named profile (--profile <n>,
  # $OPENCLAW_PROFILE, --dev) lives in ~/.openclaw-<n> with its own config,
  # workspace and sessions (OBS 2026.10.9 debian-vm: `openclaw --profile
  # test setup --baseline` made ~/.openclaw-test; magpie's notes cite
  # src/config/paths.ts and state-dir.ts).
  home_env: OPENCLAW_HOME
  named:
    # Its commands follow OPENCLAW_STATE_DIR (OBS 2026.10.9: `config get`
    # and `exec-policy show` read ~/.openclaw-test; OPENCLAW_PROFILE in the
    # environment is not honoured by `config get`, only --profile is).
    - { glob: "${HOME}/.openclaw-*", env: { OPENCLAW_STATE_DIR: "${STATE_DIR}" } }
  # The official local-prefix installer (install-cli.sh) keeps the CLI wrapper
  # and its private Node under ~/.openclaw and does not touch PATH (OBS: script
  # source, PREFIX=~/.openclaw, wrapper ${PREFIX}/bin/openclaw).
  bin_dirs: ["${HOME}/.openclaw/bin", "${HOME}/.openclaw/tools/node/bin"]   # verify: pending

roots:
  - id: workspace
    discover_argv: [openclaw, config, get, agents.defaults.workspace]   # OBS: read-only, prints one absolute path
    default: "${STATE_DIR}/workspace"                                   # WS: non-default state dir keeps workspace at <state-dir>/workspace

paths:
  # Credentials (S&S lists every file below as holding secrets)
  - { root: state, glob: "openclaw.json", category: secrets, note: "配置中可能内联网关与渠道令牌，整个文件按凭据处理" }
  - { root: state, glob: "openclaw.json.bak", category: secrets, note: "setup 写入的配置备份，与 openclaw.json 同等对待" }   # OBS
  - { root: state, glob: "openclaw.json.bak.*", category: secrets, note: "更早的配置备份，与 openclaw.json 同等对待" }   # OBS (InstaBox, after re-running setup)
  - { root: state, glob: "openclaw.json.last-good", category: secrets, note: "最近一次可用的配置副本，与 openclaw.json 同等对待" }   # OBS (InstaBox)
  - { root: state, glob: ".env", category: secrets }
  - { root: state, glob: "secrets.json", category: secrets }
  - { root: state, glob: "credentials/**", category: secrets }
  - { root: state, glob: "agents/*/agent/auth-profiles.json", category: secrets }
  - { root: state, glob: "agents/*/agent/auth.json", category: secrets }
  - { root: state, glob: "agents/*/agent/codex-home/**", category: secrets, note: "WS：含每个 agent 的 Codex 运行时账户" }
  - { root: state, glob: "config-journal-fingerprint.key", category: secrets, verify: pending }   # OBS: 32-byte 0600 key file, purpose undocumented
  # Workspace (WS: standard files)
  - { root: workspace, glob: "SOUL.md", category: identity }
  - { root: workspace, glob: "IDENTITY.md", category: identity }
  - { root: workspace, glob: "USER.md", category: identity }
  - { root: workspace, glob: "AGENTS.md", category: identity }
  - { root: workspace, glob: "BOOT.md", category: config }
  - { root: workspace, glob: "BOOTSTRAP.md", category: config }
  - { root: workspace, glob: "MEMORY.md", category: memory }
  - { root: workspace, glob: "memory/**", category: memory }
  - { root: workspace, glob: "skills/**", category: skills }
  - { root: workspace, glob: "**", category: workspace }
  # State dir (WS "What is NOT in the workspace")
  - { root: state, glob: "skills/**", category: skills }
  - { root: state, glob: "state/openclaw.sqlite", category: state }
  - { root: state, glob: "agents/*/agent/openclaw-agent.sqlite", category: state, note: "含会话与转录" }
  - { root: state, glob: "agents/*/sessions/**", category: sessions }
  - { root: state, glob: "cron/**", category: config, verify: pending }
  - { root: state, glob: "**/node_modules/**", category: cache }
  - { root: state, glob: "cache/**", category: cache }   # OBS (InstaBox): control-ui-assets, regenerated by the gateway; verify: pending
  - { root: state, glob: "tmp/**", category: ignore }    # OBS (InstaBox): per-process scratch (agent-cli, plugin-captures); verify: pending

consistency:
  sqlite:
    - { root: state, glob: "state/openclaw.sqlite", secret_tables: [mcp_oauth_stores, secret_store_entries, device_auth_tokens, device_bootstrap_tokens, gateway_origin_device_tokens, worker_environment_credentials, config_revision_keys, audit_identity_keys] }   # S&S: mcp_oauth_stores; OBS (2026-10-31): the others by column names (token, value, hmac_key, key), rows not yet observed: verify: pending
    - { root: state, glob: "agents/*/agent/openclaw-agent.sqlite", secret_tables: [auth_profile_store] }   # S&S; OBS (2026-10-31): the OAuth profile from `models auth login` was stored here (M5 acceptance)
  quiesce: none

provenance:
  kind: npm_global
  npm: { package: openclaw }   # OBS

body:
  # OBS (InstaBox, install-cli.sh): the local-prefix installer keeps its
  # private Node and the openclaw package in tools/, and the CLI wrapper in
  # bin/ (wrapper execs tools/node/bin/node tools/node-v*/lib/node_modules/openclaw).
  paths: [ { root: state, glob: "tools/**" }, { root: state, glob: "bin/**" } ]
  bootstrap_argv: []
  fresh_install_doc: https://docs.openclaw.ai/install

relocation: { env: OPENCLAW_STATE_DIR }   # S&S, WS

service:
  candidates: [ { scope: user, unit: openclaw-gateway.service } ]   # GP: default profile's systemd unit
  install_argv: [openclaw, gateway, install]   # OBS: installs and starts the unit on ubuntu-vm; refuses group-writable ~/.config/systemd

entries:
  # GP: default ws://127.0.0.1:18789, Control UI on the same port.
  # OBS (2026-10-31, 2026.10.9): `openclaw dashboard --no-open --json` prints
  # url (long-lived #token=) and browserUrl (one-time #bootstrapToken=…,
  # expires); browserUrl is used. `gateway auth-token --show` refuses to run
  # without a terminal.
  - id: gateway
    kind: web
    host: 127.0.0.1
    port: 18789
    path: "/"
    auth:
      url_argv: [openclaw, dashboard, --no-open, --json]
      url_field: browserUrl
      hint: "如果页面要求 Gateway 令牌：打开服务器终端，运行 openclaw gateway auth-token --show，把令牌粘贴到页面的 Gateway 密钥栏，再点连接"
    # OBS (2026-11-01, 2026.10.9): the port lives in config gateway.port
    # (unset by default) and in the user unit (OPENCLAW_GATEWAY_PORT and
    # ExecStart --port); `gateway install --force --port N` rewrites the unit.
    port_change:
      steps:
        - [openclaw, config, set, gateway.port, "${PORT}"]
        - [openclaw, gateway, install, --force, --port, "${PORT}"]
      restart_service: true

health:
  grace_seconds: 20
  checks:
    - { kind: systemd_active }
    - { kind: tcp, entry: gateway }
    # No argv check: a read-only health command with documented exit codes was not found.

# OBS: `openclaw models auth login --help` (2026.10.9). Over ssh (a "remote/VPS
# environment") the openai provider prints its authorization link and also
# listens for the browser callback on the server at localhost:1455; pasting
# the final redirect URL back works too.
login:
  - id: openai-codex
    display_name: "OpenAI（ChatGPT 账号）"
    kind: loopback_oauth
    argv: [openclaw, models, auth, login, --provider, openai]   # OBS (2026-10-31): redirect_uri http://localhost:1455/auth/callback; completed through the relay from macOS (M5 acceptance)
    timeout_seconds: 300
  - id: openai-codex-device
    display_name: "OpenAI（ChatGPT 账号，设备码）"
    kind: device_code
    argv: [openclaw, models, auth, login, --provider, openai, --device-code]   # OBS: flag in --help; flow: verify: pending
    timeout_seconds: 600
  - id: github-copilot
    display_name: "GitHub Copilot（设备码）"
    kind: device_code
    argv: [openclaw, models, auth, login-github-copilot]   # OBS: listed in `models auth --help` ("GitHub device flow"); flow: verify: pending
    timeout_seconds: 600

exclusive_secrets:
  - { root: state, glob: "credentials/**" }   # S&S: channel credentials (e.g. WhatsApp creds); tokens inlined in openclaw.json: verify: pending

# Official install plan (docs/INSTALL.md 3). DOC: https://docs.openclaw.ai/install
# lists install-cli.sh as the local-prefix installer (Node + OpenClaw under
# ~/.openclaw, no system Node). The script installs git with sudo apt when
# git is missing, so git is a requirement Valise checks first.
install:
  id: install-cli-user-prefix
  summary: "安装 OpenClaw 2026.10.9 和它自带的 Node 24.22.1 到 ~/.openclaw，并安装网关的用户服务；不需要管理员权限"
  where: "~/.openclaw（程序、Node 与数据都在这里），网关作为你的 systemd 用户服务运行"
  takes: "3～5 分钟，脚本会自己下载 Node 与 OpenClaw"
  notes:
    # OBS (2026-11-02, oracle, 2026.10.9): `openclaw exec-policy show` reports
    # security "OpenClaw default (full)" and ask "OpenClaw default (off)".
    - "OpenClaw 出厂时允许 agent 不经你同意执行命令（Bypass）。装好后健康页会提醒，并告诉你怎么改为执行前询问。"
  requires:
    - { binary: git, why: "安装脚本用 git；缺少时它会自己调用 sudo apt-get，所以先装好", install: [ { os_id: [debian, ubuntu], argv: [sudo, apt-get, install, -y, git] } ] }
    - { binary: curl, why: "安装脚本用它下载 Node 与 OpenClaw", install: [ { os_id: [debian, ubuntu], argv: [sudo, apt-get, install, -y, curl] } ] }
    - { binary: tar, why: "解压 Node", install: [ { os_id: [debian, ubuntu], argv: [sudo, apt-get, install, -y, tar] } ] }
  steps:
    - kind: script
      url: "https://openclaw.ai/install-cli.sh"
      sha256: "51883d8963901a4f9c6000601884ad93983eb04505c71a03f3e00ee2c99ff1be"   # 2026-11-01
      interpreter: [bash]
      args: [--version, "2026.10.9", --no-onboard]
      runtime_downloads: "Node 24.22.1（从 nodejs.org，脚本按官方 SHASUMS256.txt 校验）与 openclaw@2026.10.9（从 npm registry）"
    - { kind: argv, argv: [openclaw, setup, --baseline], note: "只写入基础配置与工作区，不连接任何模型（DOC: cli/onboard）" }   # verify: pending
    # OBS (InstaBox Debian 13, M4 ubuntu-vm): `gateway install` refuses when
    # ~/.config/systemd/user or its nearest existing ancestor is group- or
    # world-writable ("SERVICE_DEFINITION_UNKNOWN: [unsafe-permissions]").
    - { kind: argv, argv: [mkdir, -p, "${HOME}/.config/systemd/user"], note: "准备 systemd 用户服务目录" }
    - { kind: argv, argv: [chmod, go-w, "${HOME}/.config", "${HOME}/.config/systemd", "${HOME}/.config/systemd/user"], note: "去掉这些目录的组与他人写权限：OpenClaw 拒绝在组可写的目录里安装服务" }
    - { kind: argv, argv: [openclaw, gateway, install], note: "安装并启动网关的 systemd 用户服务（DOC: cli/gateway/service）" }   # verify: pending
    # OBS (2026-11-01, install-cli.sh): the local-prefix installer never puts
    # ~/.openclaw/bin on PATH (only its npm-global branch edits ~/.bashrc), so
    # `openclaw` is "command not found" in a plain ssh login.
    - kind: path_add
      dir: "${HOME}/.openclaw/bin"
      optional: true
      id: path
      skip_effect: "以后你自己 ssh 登录服务器时，直接输入 openclaw 会提示找不到命令，需要写完整路径 ~/.openclaw/bin/openclaw；用 valise shell <服务器> --profile openclaw 打开的终端不受影响。Valise 自己的功能都不受影响。"

# The harness's own guided setup: models, channels, skills (DOC: cli/onboard).
native_cli: [openclaw, onboard]
# OBS (2026-11-01, debian-vm): onboard ends waiting for the Control UI to log
# in; the UI asks for the gateway token.
native_hints:
  - "引导最后会等待控制台（Control UI）登录：不要退出引导，另开一个本机终端运行 valise open <服务器> <实例>，浏览器会带着一次性令牌打开控制台并自动登录"
  - "要手动取令牌：在 Valise 打开的终端里运行 openclaw gateway auth-token --show"
  # OBS (2026-11-01, 2026.10.9, debian-vm, user): after the Control UI
  # login the onboarding keeps waiting; Ctrl+C ends it with the config kept.
  - "控制台登录成功后，引导可能仍停在等待界面：按 Ctrl+C 结束即可，配置已经保存"

# Managed actions (docs/INSTALL.md section 5). OBS (2026-11-01, 2026.10.9,
# debian-vm): status and health need no terminal and print no token;
# `dashboard --no-open --json` has url with #token=; `gateway restart`
# restarts the user unit. `doctor --generate-gateway-token` only creates a
# token when none is set (not a rotation), so it is not offered.
actions:
  - id: status
    name: 查看网关状态
    explain: "显示网关服务是否在运行、监听的地址与端口、配置文件位置"
    risk: read
    argv: [openclaw, gateway, status]
    output: text
  - id: health
    name: 检查网关健康
    explain: "向正在运行的网关请求一次健康检查"
    risk: read
    argv: [openclaw, gateway, health]
    output: text
  - id: copy-token
    name: 复制控制台令牌
    explain: "把控制台（Control UI）登录用的网关令牌复制到剪贴板，不显示；20 秒后清除"
    risk: read
    argv: [openclaw, dashboard, --no-open, --json]
    output: secret
    secret: { json_field: url, url_param: token }
  - id: restart
    name: 重启网关
    explain: "重启 OpenClaw 网关服务；正在进行的对话会中断几秒"
    risk: manage
    argv: [openclaw, gateway, restart]
    output: none
  - id: doctor
    name: 运行 OpenClaw Doctor（交互）
    explain: "运行 OpenClaw 自己的诊断与修复向导，在独立终端里进行；它会在修改之前逐项询问"
    undo: "Doctor 的修改无法单独撤销；可以从执行前建立的逃生舱原地着陆"
    risk: config
    argv: [openclaw, doctor]
    output: none
    terminal: true

# Whether exec asks before risky commands (docs/PROFILES.md 1). Read on
# 2026.10.9 (debian-vm, gateway stopped while changing it): defaults are
# full/off (bypass); presets cautious (allowlist/on-miss) and deny-all
# (deny/off), allowlist/off and full/always all read as asking.
approval_check:
  argv: [openclaw, exec-policy, show, --json]
  each: effectivePolicy.scopes
  bypass_when: { security.effective: full, ask.effective: "off" }
  ask_when:
    - { ask.effective: always }
    - { ask.effective: on-miss }
    - { security.effective: deny }
    - { security.effective: allowlist }
  # OBS (2026-11-02, oracle, 2026.10.9 and 2026.10.3): untouched settings
  # read "OpenClaw default (full)" and "OpenClaw default (off)".
  default_when:
    - { security.requestedSource: "OpenClaw default (full)", ask.requestedSource: "OpenClaw default (off)" }

capabilities:
  install: { status: tested, versions: ["2026.10.9"], env: "Debian 13 arm64（全新虚拟机，完全访问模式装好 git 与 curl）；Debian 13 amd64（InstaBox，清空后）", note: "官方 install-cli.sh 本地前缀方案；Node 由脚本自带" }
  manage: { status: partial, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64（npm 用户级前缀）", note: "管理页与一次性配对链接已测；渠道未接入" }
  backup: { status: tested, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64（npm 用户级前缀）" }
  restore: { status: tested, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64 → 26.10 x86_64", note: "回滚、迁移、克隆、故障与崩溃退回均已演练" }
  login: { status: partial, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64", note: "OpenAI 回环登录已测；其他供应商未测" }
  checkup: { status: partial, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64", note: "会话表结构已核实；记忆机制标记待核实" }
  kit: { status: tested, versions: ["2026.10.9"], env: "Ubuntu 26.04 arm64" }

native:
  export_argv: [openclaw, backup, create, --output, "${OUT}", --verify]   # OBS: `openclaw backup create --help`

checkup:
  # S&S: transcripts live here. OBS (2026-10-31, M6 acceptance with real sessions): transcript_events(session_id, seq,
  # event_json | event_zstd, created_at INTEGER ms, event_utf8_bytes); token usage in event_json message.usage.totalTokens
  # (rows stored as event_zstd carry no readable usage and count as zero).
  sessions:
    root: state
    glob: "agents/*/agent/openclaw-agent.sqlite"
    format: sqlite
    sqlite: { table: transcript_events, session_column: session_id, time_column: created_at, time_unit: ms, size_column: event_utf8_bytes, bytes_columns: [event_json], tokens_json: { column: event_json, path: message.usage.totalTokens } }
  memory_files: [ { root: workspace, glob: "MEMORY.md", warn_lines: 600 } ]
  memory_mechanism_markers:
    - { root: workspace, glob: "MEMORY.md" }     # WS: curated long-term memory (M6 acceptance: false no_memory_mechanism without it)
    - { root: workspace, glob: "memory/*.md" }   # WS: memory/YYYY-MM-DD.md daily log
  native_options_doc: null         # verify: pending

handoff:
  targets: [ { root: workspace, glob: "MEMORY.md", mode: append_section, max_lines: 120 } ]   # WS: curated long-term memory
  new_session_hint: null           # verify: pending

agent_kit:
  skills_dir: { root: workspace, path: "skills/" }   # WS: workspace skills, highest precedence
  mcp_config_doc: null             # verify: pending
  mcp_remove_argv: [openclaw, config, unset, mcp.servers.valise]   # OBS (M6 cleanup): `openclaw mcp` has no remove; applies without a gateway restart
  mcp_add_argv: [openclaw, mcp, add, valise, --command, "${PORTER}", --arg=mcp, --arg=--instance, "--arg=${INSTANCE}"]   # OBS: `openclaw mcp add --help`; verify: pending

# What the harness calls one agent: `openclaw --profile <name>` (CLI help).
terms: { agent: profile }
