# OpenClaw. Verified on ubuntu-vm (arm64) with openclaw 2026.10.9 installed
# from npm into a user-level prefix and initialised with `openclaw setup
# --baseline` (no credentials, no gateway service).
# Sources: docs.openclaw.ai pages "Secrets, storage, and logs" (S&S),
# "Agent workspace" (WS), "Gateway ports" FAQ (GP), "Logging" (LOG), and
# observation of the real install (OBS).
schema: valise-profile/1
id: openclaw
display_name: OpenClaw
profile_version: 6
status: draft
harness_versions_tested: ["2026.10.9"]
docs: https://docs.openclaw.ai

detect:
  binaries: [openclaw]
  version_argv: [openclaw, --version]                                       # OBS: "OpenClaw 2026.10.9 (8b18b55)"
  state_dir_candidates: ["${env:OPENCLAW_STATE_DIR}", "${HOME}/.openclaw"]  # S&S
  markers_any: [openclaw.json]                                              # OBS + S&S

roots:
  - id: workspace
    discover_argv: [openclaw, config, get, agents.defaults.workspace]   # OBS: read-only, prints one absolute path
    default: "${STATE_DIR}/workspace"                                   # WS: non-default state dir keeps workspace at <state-dir>/workspace

paths:
  # Credentials (S&S lists every file below as holding secrets)
  - { root: state, glob: "openclaw.json", category: secrets, note: "配置中可能内联网关与渠道令牌，整个文件按凭据处理" }
  - { root: state, glob: "openclaw.json.bak", category: secrets, note: "setup 写入的配置备份，与 openclaw.json 同等对待" }   # OBS
  - { root: state, glob: ".env", category: secrets }
  - { root: state, glob: "secrets.json", category: secrets }
  - { root: state, glob: "credentials/**", category: secrets }
  - { root: state, glob: "agents/*/agent/auth-profiles.json", category: secrets }
  - { root: state, glob: "agents/*/agent/auth.json", category: secrets }
  - { root: state, glob: "agents/*/agent/codex-home/**", category: secrets, note: "WS：含每个 agent 的 Codex 运行时账户" }
  - { root: state, glob: "config-journal-fingerprint.key", category: secrets, verify: pending }   # OBS: 32-byte 0600 key file, purpose undocumented
  # Workspace (WS: standard files)
  - { root: workspace, glob: "SOUL.md", category: identity }
  - { root: workspace, glob: "IDENTITY.md", category: identity }
  - { root: workspace, glob: "USER.md", category: identity }
  - { root: workspace, glob: "AGENTS.md", category: identity }
  - { root: workspace, glob: "BOOT.md", category: config }
  - { root: workspace, glob: "BOOTSTRAP.md", category: config }
  - { root: workspace, glob: "MEMORY.md", category: memory }
  - { root: workspace, glob: "memory/**", category: memory }
  - { root: workspace, glob: "skills/**", category: skills }
  - { root: workspace, glob: "**", category: workspace }
  # State dir (WS "What is NOT in the workspace")
  - { root: state, glob: "skills/**", category: skills }
  - { root: state, glob: "state/openclaw.sqlite", category: state }
  - { root: state, glob: "agents/*/agent/openclaw-agent.sqlite", category: state, note: "含会话与转录" }
  - { root: state, glob: "agents/*/sessions/**", category: sessions }
  - { root: state, glob: "cron/**", category: config, verify: pending }
  - { root: state, glob: "**/node_modules/**", category: cache }

consistency:
  sqlite:
    - { root: state, glob: "state/openclaw.sqlite", secret_tables: [mcp_oauth_stores, secret_store_entries, device_auth_tokens, device_bootstrap_tokens, gateway_origin_device_tokens, worker_environment_credentials, config_revision_keys, audit_identity_keys] }   # S&S: mcp_oauth_stores; OBS (2026-10-31): the others by column names (token, value, hmac_key, key), rows not yet observed: verify: pending
    - { root: state, glob: "agents/*/agent/openclaw-agent.sqlite", secret_tables: [auth_profile_store] }   # S&S; OBS (2026-10-31): the OAuth profile from `models auth login` was stored here (M5 acceptance)
  quiesce: none

provenance:
  kind: npm_global
  npm: { package: openclaw }   # OBS

body: { paths: [], bootstrap_argv: [], fresh_install_doc: https://docs.openclaw.ai }

relocation: { env: OPENCLAW_STATE_DIR }   # S&S, WS

service:
  candidates: [ { scope: user, unit: openclaw-gateway.service } ]   # GP: default profile's systemd unit
  install_argv: [openclaw, gateway, install]   # OBS: installs and starts the unit on ubuntu-vm; refuses group-writable ~/.config/systemd

entries:
  - { id: gateway, kind: web, host: 127.0.0.1, port: 18789, path: "/" }   # GP: default ws://127.0.0.1:18789, Control UI on the same port

health:
  grace_seconds: 20
  checks:
    - { kind: systemd_active }
    - { kind: tcp, entry: gateway }
    # No argv check: a read-only health command with documented exit codes was not found.

# OBS: `openclaw models auth login --help` (2026.10.9). Over ssh (a "remote/VPS
# environment") the openai provider prints its authorization link and also
# listens for the browser callback on the server at localhost:1455; pasting
# the final redirect URL back works too.
login:
  - id: openai-codex
    display_name: "OpenAI（ChatGPT 账号）"
    kind: loopback_oauth
    argv: [openclaw, models, auth, login, --provider, openai]   # OBS (2026-10-31): redirect_uri http://localhost:1455/auth/callback; completed through the relay from macOS (M5 acceptance)
    timeout_seconds: 300
  - id: openai-codex-device
    display_name: "OpenAI（ChatGPT 账号，设备码）"
    kind: device_code
    argv: [openclaw, models, auth, login, --provider, openai, --device-code]   # OBS: flag in --help; flow: verify: pending
    timeout_seconds: 600
  - id: github-copilot
    display_name: "GitHub Copilot（设备码）"
    kind: device_code
    argv: [openclaw, models, auth, login-github-copilot]   # OBS: listed in `models auth --help` ("GitHub device flow"); flow: verify: pending
    timeout_seconds: 600

exclusive_secrets:
  - { root: state, glob: "credentials/**" }   # S&S: channel credentials (e.g. WhatsApp creds); tokens inlined in openclaw.json: verify: pending

native:
  export_argv: [openclaw, backup, create, --output, "${OUT}", --verify]   # OBS: `openclaw backup create --help`

checkup:
  # S&S: transcripts live here. OBS (2026-10-31): transcript_events(session_id, seq, event_json | event_zstd, created_at INTEGER,
  # event_utf8_bytes); no rows yet, so the time unit and where token usage lives: verify: pending
  sessions:
    root: state
    glob: "agents/*/agent/openclaw-agent.sqlite"
    format: sqlite
    sqlite: { table: transcript_events, session_column: session_id, time_column: created_at, time_unit: ms, size_column: event_utf8_bytes, bytes_columns: [event_json] }
  memory_files: [ { root: workspace, glob: "MEMORY.md", warn_lines: 600 } ]
  memory_mechanism_markers: [ { root: workspace, glob: "memory/*.md" } ]   # WS: memory/YYYY-MM-DD.md daily log
  native_options_doc: null         # verify: pending

handoff:
  targets: [ { root: workspace, glob: "MEMORY.md", mode: append_section, max_lines: 120 } ]   # WS: curated long-term memory
  new_session_hint: null           # verify: pending

agent_kit:
  skills_dir: { root: workspace, path: "skills/" }   # WS: workspace skills, highest precedence
  mcp_config_doc: null             # verify: pending
  mcp_add_argv: [openclaw, mcp, add, valise, --command, "${PORTER}", --arg=mcp, --arg=--instance, "--arg=${INSTANCE}"]   # OBS: `openclaw mcp add --help`; verify: pending
