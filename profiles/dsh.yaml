# DeepSeek Harness (dsh). Verified on ubuntu-vm (arm64) with
# @deepseek-ai/dsh 0.2.1-rc.5 installed from npm into a user-level prefix and
# initialised by `dsh web --dump-config` (no credentials, never booted).
# Sources: the package READMEs shipped with that exact version — dsh (README),
# dsh-credentials-local (CRED) — the composed web profile from
# `dsh web --dump-config` (DUMP), and observation of the install (OBS).
# M6 (2026-10-31): first real sessions with a user-supplied provider in the
# shipped `headless` profile; package READMEs dsh-skill-filesystem (SKILL),
# dsh-agent-instructions (INSTR) and dsh-mcp-client (MCP).
# DSH is a developer preview: re-verify on every version bump.
schema: valise-profile/1
id: dsh
display_name: DeepSeek Harness
profile_version: 3
status: draft
harness_versions_tested: ["0.2.1-rc.5"]
docs: https://github.com/deepseek-ai/deepseek-harness

detect:
  binaries: [dsh]
  version_argv: [dsh, --version]                               # OBS: prints "0.2.1-rc.5"
  state_dir_candidates: ["${env:DSH_HOME}", "${HOME}/.dsh"]    # README, CRED
  markers_any: [profiles]                                       # OBS: created on first use of a shipped profile

roots: []

paths:
  - { root: state, glob: ".credentials.yaml", category: secrets }   # CRED: default credential store
  - { root: state, glob: ".env", category: secrets }                # CRED: harness-home .env fallback
  - { root: state, glob: "cordis.patch.yml", category: config }     # README: home-level patch layer
  - { root: state, glob: "AGENTS.md", category: identity }          # INSTR: user-global instructions, loaded into every session
  - { root: state, glob: "skills/**", category: skills }            # SKILL: user-dsh skill root <dshHome>/skills
  - { root: state, glob: "profiles/*/node_modules/**", category: cache, note: "pnpm 按 package.json 安装的插件，可重建" }   # README
  - { root: state, glob: "profiles/*/package.json", category: config }       # README
  - { root: state, glob: "profiles/*/cordis.patch.yml", category: config }   # README
  - { root: state, glob: "profiles/*/cordis.yml", category: config }         # OBS
  - { root: state, glob: "profiles/*/pnpm-workspace.yaml", category: config }   # OBS
  - { root: state, glob: "profiles/*/pnpm-lock.yaml", category: config, verify: pending }
  - { root: state, glob: "sessions/**", category: sessions }        # DUMP: session-persistence-jsonl root dshHomePath('sessions')
  - { root: state, glob: "storages/**", category: state }           # DUMP: storage-json root dshHomePath('storages')

consistency: { sqlite: [], quiesce: none }   # DUMP: session-query-sqlite runs in memory

provenance:
  kind: npm_global
  npm: { package: "@deepseek-ai/dsh" }   # OBS

body: { paths: [], bootstrap_argv: [], fresh_install_doc: https://github.com/deepseek-ai/deepseek-harness }

relocation: { env: DSH_HOME }   # CRED: dshHome defaults to $DSH_HOME or ~/.dsh

service: { candidates: [] }     # runs in the foreground (`dsh web`)

entries:
  - { id: web, kind: web, host: 127.0.0.1, port: 3080, path: "/" }   # DUMP: host ?? '127.0.0.1', port ?? 3080

health:
  grace_seconds: 15
  checks:
    - { kind: tcp, entry: web }

login: []

exclusive_secrets: []              # verify: pending

native: { export_argv: null }

checkup:
  # OBS (M6): sessions/<project>/session-<uuid>/session.v4.jsonl.zstd (zstd JSONL, event "time" in ms) next to
  # session.lock; headless runs record no token usage, so tokens are estimated.
  sessions: { root: state, glob: "sessions/*/*/session.v*.jsonl.zstd", format: jsonl, time_field: time }
  memory_files: []
  memory_mechanism_markers: []     # 由各记忆插件的子 profile 追加
  native_options_doc: null

# Without a memory plugin the user-global AGENTS.md is the only native file
# every new session loads (INSTR); handoff appends a dated section there.
handoff:
  targets: [ { root: state, glob: "AGENTS.md", mode: append_section, max_lines: 120 } ]
  new_session_hint: "Start a new dsh session (run dsh again without --resume); it loads ~/.dsh/AGENTS.md."

agent_kit:
  skills_dir: { root: state, path: "skills/" }   # SKILL: user-dsh root; enabled in the shipped headless profile, disabled in web (DUMP)
  mcp_config_doc: null             # verify: pending
  # MCP: no CLI command; append this entry to the patch layer of the profile you run, e.g. ~/.dsh/profiles/headless/cordis.patch.yml
  # (dsh-app-boot: new entries go in an insert list; an id-only patch must name an existing entry)
  mcp_config_snippet: |
    # append to ~/.dsh/profiles/<profile>/cordis.patch.yml
    - insert:
        - id: mcp-valise
          name: '@deepseek-ai/dsh-mcp-client'
          config:
            serverName: valise
            transport: stdio
            command: ${PORTER}
            args: [mcp, --instance, ${INSTANCE}]
