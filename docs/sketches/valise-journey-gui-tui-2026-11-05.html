<body>
<div class="review">
<header class="review-head"><div><h1>Valise，下一段旅程</h1><p>GUI / TUI 交互草图 · 2026 年 11 月 5 日</p></div><div class="switch" role="group" aria-label="查看界面类型"><button data-mode="gui" class="active" aria-pressed="true">GUI</button><button data-mode="tui" aria-pressed="false">TUI</button></div></header>
<nav class="scenes" aria-label="草图场景"></nav>
<div class="prototype-note"><span>评审草图 · 全部为示例数据，操作只切换演示页面，不连接服务器。</span><span id="scene-count"></span></div>
<div id="gui-view" class="device-scroll"><div class="window"><div class="windowbar"><i></i><i></i><i></i><span>Valise</span></div><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="content" id="gui-content"></main></div></div></div>
<div id="tui-view" hidden><div class="terminal-options"><span>同一条用户路径，适配终端的信息密度。</span><div class="switch" role="group" aria-label="终端尺寸"><button data-size="80" aria-pressed="true" class="active">80 × 24</button><button data-size="100" aria-pressed="false">100 × 30</button></div></div><div class="device-scroll terminal-shell"><div class="terminal-bar"><span>valise tui</span><span id="terminal-size">80 列 × 24 行</span></div><div class="terminal-scroll"><pre class="terminal" id="terminal" aria-label="终端界面草图"></pre></div></div><p class="terminal-keynote">预览支持点击高亮行与底部按键行；1–7 切换草图，旅程页 ↑↓ 选择时间点，Enter 查看恢复计划。实际终端使用键盘操作。</p></div>
<div class="scene-caption"><p id="caption"></p><p><strong>本轮评审</strong><br>先看入口、信息顺序和操作负担；图标、字形与旅行视觉尚未定稿。</p></div>
</div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const scenes=[['home','我的 Agent'],['overview','Agent 概览'],['journey','旅程时间轴'],['start','从零开始'],['adopt','接入已有'],['health','健康'],['restore','恢复预览']];
const state={mode:'gui',scene:'journey',cols:80,point:0,startStep:0,tuiDetail:false,tuiDestination:'current',journeyPhase:'timeline',journeyView:'river',journeyBusy:false};
let journeyTimer=null;
let journeyOrigin={x:.5,y:.5};
let journeyAnimations=[];
const points=[{date:'11 月 5 日',time:'09:00',reason:'定时备份',range:'默认备份',location:'服务器、本机、NAS',hint:'记忆、会话、配置、凭据、工作区和未识别文件',tested:false},{date:'11 月 4 日',time:'18:42',reason:'修改设置前',range:'默认备份',location:'服务器、本机、NAS',hint:'记忆、会话、配置、凭据、工作区和未识别文件',tested:true},{date:'11 月 4 日',time:'09:00',reason:'定时备份',range:'默认备份',location:'服务器、NAS',hint:'记忆、会话、配置、凭据、工作区和未识别文件',tested:false},{date:'11 月 3 日',time:'10:15',reason:'手动备份',range:'轻装（历史备份）',location:'服务器、NAS',hint:'记忆、会话和已声明的非敏感配置；不含凭据、工作区与未识别文件',tested:false}];
const captions={home:'<strong>日常起点。</strong>先找到自己的 Agent。运行与保护各说各的，有问题才提升提醒；服务器仍可单独管理。',overview:'<strong>少一层导航。</strong>直接打开 Agent，原生入口、需要处理的事和保护摘要放在前面。底层共享安装关系保留。',journey:'<strong>旅程就是保存下来的历史。</strong>左侧选时间，右侧看内容、副本和验证边界。旧的轻装备份如实标范围，不冒充完整恢复点。',start:'<strong>从零开始。</strong>入口先让用户选择任务，再分步连接与安装。真实登录、安装来源与权限确认在相应步骤处理。',adopt:'<strong>接入已有。</strong>示意连接后发现结果。先说明接入会做什么，再确认；不要求重装，不默装技能。',health:'<strong>解释影响，然后给下一步。</strong>备份、运行、审批与检查完整性分别表达；不使用笼统安全分数。',restore:'<strong>先选过去，再选去处。</strong>这里只到恢复计划预览，下一步仍要完成实际校验与确认；迁移和复制明确区分。'};
const iconPaths={case:'<rect x="4" y="7" width="16" height="14" rx="3"/><path d="M9 7V4h6v3M9 11v6m6-6v6"/>',agents:'<rect x="5" y="6" width="14" height="13" rx="4"/><path d="M12 3v3M8 12h.01M16 12h.01M9 16h6"/>',server:'<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01M13 7h3m-3 10h3"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/>',tools:'<path d="m14 6 4-3 3 3-3 4-3-1-9 11-3-3L14 7Z"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',back:'<path d="m14 6-6 6 6 6"/>',link:'<path d="m10 13 4-4M8 15l-2 2a3 3 0 0 1-4-4l4-4a3 3 0 0 1 4 0m4 0 2-2a3 3 0 0 1 4 4l-4 4a3 3 0 0 1-4 0"/>',open:'<path d="M14 4h6v6m0-6L10 14M10 5H4v15h15v-6"/>'};
function icon(name,size=19){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[name]||iconPaths.case)+'</svg>';}
function button(label,action,primary=false,extra=''){return '<button class="btn '+(primary?'primary ':'')+extra+'" data-action="'+action+'">'+label+'</button>';}
function tabs(active){return '<div class="tabs">'+[['overview','概览'],['journey','旅程'],['health','健康'],['manage','管理与设置']].map(([id,label])=>'<button data-action="'+id+'" class="'+(active===id?'active':'')+'">'+label+'</button>').join('')+'</div>';}
function crumb(last){return '<div class="crumb"><button data-action="home">我的 Agent</button> / <button data-action="overview">小满</button> / '+last+'</div>';}
function agentHeading(){return '<div class="pagehead"><div class="agent-top"><div class="avatar">满</div><div><h2>小满</h2><p>OpenClaw · 家里的服务器 <span class="tag">运行中</span></p></div></div>'+button('打开管理页','native',true)+'</div>';}
function sidebar(){document.querySelector('#sidebar').innerHTML='<div class="brand">'+icon('case',27)+'Valise</div><nav class="nav" aria-label="应用导航">'+[['agents','我的 Agent','home'],['server','服务器','servers'],['folder','备份位置','locations'],['tools','工具箱','toolbox']].map(([i,t,a])=>'<button data-action="'+a+'" class="'+(!['start','adopt'].includes(state.scene)&&a==='home'?'selected':'')+'">'+icon(i)+t+'</button>').join('')+'</nav><div class="sidebar-bottom"><nav class="nav"><button data-action="settings">'+icon('settings')+'设置</button></nav><div class="connection"><span class="dot"></span>2 台服务器已连接</div><p>带着你的 Agent 去旅行。</p></div>';}
function home(){return '<div class="pagehead"><div><h2>我的 Agent</h2><p>熟悉的伙伴，都在这里。</p></div>'+button(icon('plus',15)+' 添加 Agent','start',true)+'</div><div class="notice"><div><strong>阿蓝的最新备份还没有复制到别处。</strong><br><span class="muted">服务器损坏时，今天新增的内容可能无法找回。</span></div>'+button('查看备份位置','locations',false,'small')+'</div><div class="section-title"><h3>已接入的 Agent</h3><span class="tiny muted">按名字排列</span></div><div class="agent-list">'+[['满','小满','OpenClaw · 家里的服务器','09:00 已备份','本机和 NAS 均有副本','',true],['蓝','阿蓝','Hermes · 云服务器','08:30 已备份','最新副本只在服务器','yellow',true],['研','研究助手','OpenClaw · 家里的服务器','昨天 21:15 已备份','NAS 有副本','sage',false]].map(([a,n,s,b,l,c,r])=>'<article class="agent-row"><div class="avatar '+c+'">'+a+'</div><div><button class="agent-name" data-action="'+(n==='小满'?'overview':'sample-agent')+'">'+n+'</button><div class="agent-sub">'+s+'</div><div class="status '+(r?'':'stopped')+'"><span class="dot"></span>'+(r?'运行中':'已停止')+'</div></div><div class="protection">'+b+'<small>'+l+'</small></div>'+button('查看旅程',n==='小满'?'journey':'sample-agent',false,'small')+'</article>').join('')+'</div><div class="footer-hint">'+icon('clock',15)+'下一次定时备份：明天 09:00。可在每个 Agent 的设置中调整。</div>';}
function overview(){return crumb('概览')+agentHeading()+tabs('overview')+'<div class="overview-grid"><div><section class="panel"><h3>正在家里的服务器上运行</h3><dl class="facts"><dt>运行框架</dt><dd>OpenClaw 2026.10.9</dd><dt>管理入口</dt><dd>可打开<small>通过本机浏览器访问服务器上的管理页</small></dd><dt>最近检查</dt><dd>今天 10:20<small>服务运行与管理页检查通过</small></dd></dl><div class="row" style="margin-top:20px">'+button('登录授权','native')+button('管理与设置','manage')+'</div></section><div class="section-title"><h3>需要处理的事</h3></div><div class="aside-note">最近备份尚未做恢复测试。文件已保存，并不代表已验证能够运行。<br>'+button('查看健康','health',false,'text')+'</div></div><div><section class="panel"><h3>最近的保护</h3><dl class="facts"><dt>最近备份</dt><dd>今天 09:00</dd><dt>保存内容</dt><dd>默认备份<small>状态、记忆、会话、凭据与工作区</small></dd><dt>备份副本</dt><dd>服务器、本机、NAS</dd></dl>'+button('查看完整旅程','journey',false,'text')+'</section><div class="section-title"><h3>最近保存</h3></div><div class="recent"><div class="row"><span>今天 09:00</span><span class="tag">定时</span></div><small>默认备份</small></div><div class="recent"><div class="row"><span>昨天 18:42</span><span class="tag">设置修改前</span></div><small>恢复测试：暂存与文件校验通过</small></div></div></div>';}
function journeyList(){const p=points[state.point];return crumb('旅程')+'<div class="journeyhead"><div class="pagehead"><div><h2>小满的旅程</h2><p>保存走过的路，需要时从这里继续。</p></div>'+button('备份现在','backup',true)+'</div></div>'+tabs('journey')+'<div class="journey-layout"><div><div class="section-title" style="margin-top:0"><h3>2026 年 11 月</h3><span class="tiny muted">4 个保存时间点</span></div><div class="time-list">'+points.map((x,i)=>(i===0||x.date!==points[i-1].date?'<div class="date-label">'+x.date+'</div>':'')+'<button class="point '+(i===state.point?'active':'')+'" data-point="'+i+'" aria-pressed="'+(i===state.point)+'"><span class="point-title"><span>'+x.time+'　'+x.reason+'</span><span>'+icon('check',14)+'</span></span><p>'+x.range+'</p><p>'+x.location+' 有副本</p>'+(x.tested?'<span class="tag">暂存与文件校验通过</span>':'')+'</button>').join('')+'</div><button class="btn text tiny" data-action="older">查看 10 月记录</button></div><section class="detail"><span class="route-label">小满 / '+p.date+'</span><h3>'+p.date+' '+p.time+'</h3><p class="subtitle">'+p.reason+' · 保存成功</p><h4>这次带上了什么</h4><p style="font-size:12px;margin:0">'+p.hint+'</p>'+(state.point===3?'<div class="restore-warning">历史轻装备份：恢复时不能补齐未保存的凭据和工作区。</div>':'<p class="tiny muted">有 2 个未识别文件，已按敏感内容保存。</p>')+'<h4>副本在哪里</h4><ul class="checklist">'+p.location.split('、').map(x=>'<li><span class="checkmark">✓</span>'+x+'：已有副本</li>').join('')+'</ul><h4>恢复验证</h4><p class="tiny muted">'+(p.tested?'暂存与文件校验通过。未启动独立服务，不代表已验证可运行。':'尚未对这个时间点进行恢复测试。')+'</p><hr>'+button('从这个时间点恢复','restore',true)+'<div class="row">'+button('查看文件','files')+button('导出','export')+'</div></section></div>';}
function journey(){
  if(state.journeyPhase==='detail')return snapshotPage();
  if(state.journeyView==='list')return '<div class="row" style="justify-content:flex-end;margin-bottom:12px">'+button('回到旅程视图','river-view')+'</div>'+journeyList();
  const stops=[{index:3,x:15,y:36.25,side:'above'},{index:2,x:38.333,y:65,side:'below'},{index:1,x:61.667,y:41.25,side:'above'},{index:0,x:86.667,y:47.5,side:'below'}];
  const path='M -80 210 C 40 290 90 85 180 145 C 290 200 300 300 460 260 C 600 220 620 110 740 165 C 860 220 900 295 1040 190 C 1150 110 1200 150 1280 210';
  const strands='<path d="'+path+'" fill="none" stroke="#6e899e" stroke-width="1" opacity=".5"/>'+Array.from({length:18},(_,i)=>'<path class="river-thread" d="'+path+'" transform="translate(0 '+(Math.sin(i*2.4)*6)+')" fill="none" stroke="'+(i%5===0?'#b39a65':'#66869e')+'" stroke-width=".65" opacity="'+(.13+(i%4)*.045)+'" style="--flow-duration:'+(34+i*2)+'s;--thread-length:'+(160+i%5*55)+';--thread-offset:'+(-i*103)+'"/>').join('');
  return '<section class="journey-cinematic" aria-labelledby="journey-title"><div class="journey-topline"><button class="btn text" data-action="overview">'+icon('back',16)+'小满</button><span class="tiny muted">旅程</span><button class="btn text" data-action="home">回到我的 Agent</button></div><div class="journey-titlebar"><div><p class="journey-kicker">家里的服务器 · OpenClaw</p><h2 id="journey-title" tabindex="-1">小满走过的路</h2><p class="muted">选择一个保存下来的时刻。</p></div>'+button('备份现在','backup',true)+'</div><div class="journey-period"><div class="row"><span class="period-label">2026 年 11 月</span><span class="tiny muted">4 个时间点</span></div><button class="btn text tiny" data-action="list-view">列表视图</button></div><div class="river-scene" aria-label="11 月备份时间轴"><svg class="journey-river" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">'+strands+'</svg>'+stops.map(({index,x,y,side})=>{const p=points[index];return '<button class="snapshot-stop '+side+(index===state.point?' current':'')+'" style="left:'+x+'%;top:'+y+'%" data-action="open-snapshot:'+index+'" data-snapshot="'+index+'" aria-label="查看 '+p.date+' '+p.time+' '+p.reason+'，'+p.range+'"><span class="stop-halo" aria-hidden="true"></span><span class="stop-core" aria-hidden="true"></span><span class="stop-stem" aria-hidden="true"></span><span class="stop-label"><strong>'+p.date+' <span>'+p.time+'</span></strong><small>'+p.reason+(index===3?' · 历史轻装':'')+'</small></span></button>';}).join('')+'</div><div class="journey-bottom"><button class="btn text tiny" data-action="older">查看更早的旅程</button><p>每次保存，都为以后留下一条回来的路。</p><span class="tiny muted">最近备份：今天 09:00</span></div></section>';
}
function snapshotPage(){
  const p=points[state.point],old=state.point===3;
  return '<section class="snapshot-page" aria-labelledby="snapshot-title"><div class="journey-topline"><button class="btn text" data-action="back-to-river">'+icon('back',16)+'返回旅程</button><span class="tiny muted">小满 / 备份详情</span><button class="btn text" data-action="home">我的 Agent</button></div><div class="snapshot-layout"><div class="snapshot-story"><span class="route-label">'+p.range+'</span><h2 id="snapshot-title" tabindex="-1">'+p.date+'<span>'+p.time+'</span></h2><p class="snapshot-reason">'+p.reason+'</p><p class="muted">小满在这个时刻保存下来的状态。</p><div class="snapshot-rule"></div><h3>这次带上了什么</h3><p class="snapshot-contents">'+p.hint+'</p>'+(old?'<div class="restore-warning">这份历史备份没有保存凭据、工作区和未识别文件。恢复时无法补齐这些内容。</div>':'<p class="tiny muted">2 个未识别文件已按敏感内容保留。</p>')+'</div><aside class="snapshot-actions"><h3>从这里继续</h3><p>先准备并校验恢复材料，确认后再修改目标实例。</p>'+button('从这个时间点恢复','restore',true)+'<div class="row">'+button('查看文件','files')+button('导出','export')+'</div><div class="snapshot-rule"></div><h4>备份副本</h4><ul class="checklist">'+p.location.split('、').map(x=>'<li><span class="checkmark">✓</span>'+x+'：已有副本</li>').join('')+'</ul><h4>恢复验证</h4><p class="tiny muted">'+(p.tested?'暂存与文件校验通过。尚未验证独立启动。':'尚未对这个时间点进行恢复测试。')+'</p></aside></div><div class="snapshot-pagination">'+button('较早的时间点','previous-snapshot',false,'small')+'<span class="tiny muted">'+(points.length-state.point)+' / '+points.length+'</span>'+button('较新的时间点','next-snapshot',false,'small')+'</div></section>';
}
function cancelJourneyTransition(){
  clearTimeout(journeyTimer);journeyTimer=null;
  journeyAnimations.forEach(a=>a.cancel());journeyAnimations=[];
  document.querySelectorAll('.journey-outgoing').forEach(el=>el.remove());
  document.querySelectorAll('.activating').forEach(el=>el.classList.remove('activating'));
  document.querySelector('.river-scene')?.removeAttribute('aria-busy');
  state.journeyBusy=false;
}
function transitionJourney(change,kind='open'){
  if(state.journeyBusy)return;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const host=document.querySelector('#gui-content'),old=host.firstElementChild;
  const ghost=!reduced&&old?old.cloneNode(true):null;
  if(ghost){
    ghost.classList.add('journey-outgoing');ghost.setAttribute('aria-hidden','true');ghost.inert=true;
    ghost.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));ghost.removeAttribute('id');
    Object.assign(ghost.style,{left:old.offsetLeft+'px',top:old.offsetTop+'px',width:old.offsetWidth+'px',animation:'none'});
  }
  change();render();
  const next=host.firstElementChild;
  const focusTarget=state.journeyPhase==='detail'?'#snapshot-title':'#journey-title';
  if(reduced){document.querySelector(focusTarget)?.focus({preventScroll:true});return;}
  state.journeyBusy=true;
  if(ghost)host.append(ghost);
  const origin=(journeyOrigin.x*100)+'% '+(journeyOrigin.y*100)+'%';
  const paging=kind==='older'||kind==='newer',direction=kind==='older'?-1:1;
  const enter=paging?'translateX('+(-direction*40)+'px)':kind==='back'?'scale(1.035)':'scale(.84)';
  const exit=paging?'translateX('+(direction*40)+'px)':kind==='back'?'scale(.84)':'scale(1.045)';
  next.style.animation='none';next.style.transformOrigin=origin;
  journeyAnimations=[next.animate([{opacity:0,transform:enter},{opacity:1,transform:'none'}],{duration:440,easing:'cubic-bezier(.16,1,.3,1)'})];
  if(ghost){ghost.style.transformOrigin=origin;journeyAnimations.push(ghost.animate([{opacity:1,transform:'none'},{opacity:0,transform:exit}],{duration:360,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}));}
  journeyTimer=setTimeout(()=>{ghost?.remove();journeyAnimations=[];state.journeyBusy=false;document.querySelector(focusTarget)?.focus({preventScroll:true});},440);
}
function openSnapshot(index){
  if(state.journeyBusy)return;
  state.point=index;
  const node=document.querySelector('.snapshot-stop[data-snapshot="'+index+'"]');
  const host=document.querySelector('#gui-content');
  if(node){const n=node.getBoundingClientRect(),h=host.getBoundingClientRect();journeyOrigin={x:(n.left+n.width/2-h.left)/h.width,y:(n.top+n.height/2-h.top)/h.height};node.classList.add('activating');}
  document.querySelector('.river-scene')?.setAttribute('aria-busy','true');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){transitionJourney(()=>state.journeyPhase='detail');return;}
  state.journeyBusy=true;
  journeyTimer=setTimeout(()=>{state.journeyBusy=false;transitionJourney(()=>state.journeyPhase='detail');},300);
}

}
function terminalActionLabel(action){const labels={overview:'打开小满概览',journey:'查看小满旅程',health:'查看健康',native:'打开管理页',locations:'查看备份位置',start:'添加 Agent',servers:'查看服务器','new-server':'从零开始',adopt:'接入已有',restore:'从所选时间点恢复','tui-details':'查看备份内容','tui-close':'返回旅程','sample-agent':'其他 Agent 示例','adopt-confirm':'接入并设置备份','detect-details':'查看识别详情','approval-help':'查看处理方法','test-plan':'查看恢复测试计划','current-destination':'选择当前实例','new-destination':'选择另一台服务器',prepare:'准备恢复计划','target-server':'选择目标服务器'};return action.startsWith('point:')?'选择 '+points[Number(action.split(':')[1])].date+' '+points[Number(action.split(':')[1])].time:labels[action]||action;}
function render(){document.querySelector('.scenes').innerHTML=scenes.map(([id,label],i)=>'<button data-scene="'+id+'" class="'+(state.scene===id?'active':'')+'" aria-pressed="'+(state.scene===id)+'">'+label+'</button>').join('');document.querySelector('#scene-count').textContent=(scenes.findIndex(x=>x[0]===state.scene)+1)+' / '+scenes.length;document.querySelectorAll('[data-mode]').forEach(b=>{const a=b.dataset.mode===state.mode;b.classList.toggle('active',a);b.setAttribute('aria-pressed',a);});document.querySelectorAll('[data-size]').forEach(b=>{const a=Number(b.dataset.size)===state.cols;b.classList.toggle('active',a);b.setAttribute('aria-pressed',a);});document.querySelector('#gui-view').hidden=state.mode!=='gui';document.querySelector('#tui-view').hidden=state.mode!=='tui';sidebar();document.querySelector('#gui-view .app').classList.toggle('journey-expanded',state.scene==='journey'&&(state.journeyView==='river'||state.journeyPhase==='detail'));document.querySelector('#gui-content').innerHTML=renderers[state.scene]();renderTerminal();document.querySelector('#caption').innerHTML=state.scene==='journey'&&state.mode==='gui'?'<strong>进入旅程。</strong>细线缓缓流动；点选节点约 300ms 后，从所选位置展开详情，柔光与转场重叠。返回收拢，前后时间点按方向翻页。节点按时间排序；曲线起伏仅作视觉引导，不代表状态评分。':captions[state.scene];}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,5500);}
function go(scene){cancelJourneyTransition();state.scene=scene;state.tuiDetail=false;if(scene==='journey')state.journeyPhase='timeline';render();}
const messages={native:'草图说明：实际会打开 harness 的原生页面或授权流程；本页不会发起连接。',manage:'管理与设置：备份计划、显示名、已核实动作和安装事实。此页本轮未展开。',servers:'服务器页：连接与环境、共享安装和访问管理。此页本轮未展开。',locations:'备份位置页：查看本机 / NAS 等副本、同步失败原因和下一步。此页本轮未展开。',toolbox:'工具箱：按用途选择技能与工具，安装前说明范围和权限。此页本轮未展开。',settings:'设置：钥匙与恢复材料、资料包、AI 接入和客户端选项。此页本轮未展开。',backup:'草图演示：接下来显示备份范围与进度，成功后在旅程新增时间点。当前没有执行备份。',files:'草图演示：只读查看该时间点保存的文件清单与范围。',export:'草图演示：选择导出内容；排除已声明凭据不代表全文已脱敏。',older:'草图演示：展开 10 月周期；跨周期浏览不代表删除或合并历史。','sample-agent':'本轮以「小满」展开完整路径；其他 Agent 用于示意首页状态。','ssh-import':'草图演示：选择现有 SSH 配置中的服务器，再检查连接。','detect-details':'草图演示：展开来源、目录、未识别内容和逐项支持情况。','approval-help':'处理方法示意：解释当前审批行为，提供已核实的原生设置指引；不展示尚未验收的自动修复按钮。','test-plan':'草图演示：查看暂存和校验计划，确认后才开始恢复测试；测试不替换当前状态。',recheck:'草图演示：重新读取各项结果。读取失败应显示无法判断，不用旧结果假装成功。',prepare:'草图到此：下一步取回数据、写暂存并校验，再确认是否交换。没有执行恢复。','new-destination':'草图说明：另一台服务器还需选择「迁移」或「创建副本」，再处理独占登录身份。','current-destination':'已选择当前实例；还需准备、校验与最终确认。',connect:'草图到此：接下来确认主机身份、由 OpenSSH 登录并检查环境。没有连接服务器。'};
function action(id){if(id.startsWith('open-snapshot:')){openSnapshot(Number(id.split(':')[1]));return;}if(id==='back-to-river'){if(state.journeyBusy)return;transitionJourney(()=>{state.journeyPhase='timeline';state.journeyView='river';},'back');return;}if(['river-view','list-view'].includes(id)){cancelJourneyTransition();state.journeyPhase='timeline';state.journeyView=id==='list-view'?'list':'river';render();document.querySelector('#journey-title')?.focus({preventScroll:true});return;}if(['previous-snapshot','next-snapshot'].includes(id)){if(state.journeyBusy)return;const next=Math.max(0,Math.min(points.length-1,state.point+(id==='previous-snapshot'?1:-1)));if(next===state.point){toast('已经是本段旅程的'+(next===0?'最新':'最早')+'时间点。');return;}transitionJourney(()=>state.point=next,id==='previous-snapshot'?'older':'newer');return;}if(state.mode==='tui'&&['tui-details','tui-close'].includes(id)){state.tuiDetail=id==='tui-details';render();return;}if(state.mode==='tui'&&['current-destination','new-destination'].includes(id)){state.tuiDestination=id==='new-destination'?'new':'current';render();return;}if(id==='target-server'){toast('草图下一步：选择目标服务器，再选择迁移或创建副本。');return;}if(id.startsWith('point:')){state.point=Number(id.split(':')[1]);render();return;}if(id==='new-server'){state.scene='start';state.startStep=1;render();return;}if(id==='start-back'){state.startStep=0;render();return;}if(id==='adopt-confirm'){state.scene='overview';render();toast('草图演示：登记后进入概览，再设置备份计划。没有写入实际档案。');return;}if(scenes.some(x=>x[0]===id)){if(id==='start')state.startStep=0;go(id);return;}toast(messages[id]||'此内容不在本轮展开范围。');}
document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]'),scene=e.target.closest('[data-scene]'),size=e.target.closest('[data-size]'),point=e.target.closest('[data-point]'),a=e.target.closest('[data-action]');if(mode){cancelJourneyTransition();state.mode=mode.dataset.mode;render();}else if(scene){if(scene.dataset.scene==='start')state.startStep=0;go(scene.dataset.scene);}else if(size){state.cols=Number(size.dataset.size);render();}else if(point){state.point=Number(point.dataset.point);render();}else if(a){e.preventDefault();action(a.dataset.action);}});
document.addEventListener('submit',e=>{if(e.target.id==='connect-form'){e.preventDefault();action('connect');}});
document.addEventListener('change',e=>{if(e.target.name==='destination'){document.querySelector('#destination-note').textContent=e.target.value==='new'?'下一步选择迁移或创建副本、目标服务器与环境。迁移处理旧实例切换，副本默认不复制独占渠道身份。':'当前状态会被替换。先准备暂存副本并校验，查看完整计划后再确认，不会在这一步修改 Agent。';}});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.target.matches('[data-action]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();action(e.target.dataset.action);return;}if(state.mode==='gui'&&state.scene==='journey'&&state.journeyPhase==='detail'&&['ArrowLeft','ArrowRight','Escape'].includes(e.key)){e.preventDefault();action(e.key==='Escape'?'back-to-river':e.key==='ArrowLeft'?'previous-snapshot':'next-snapshot');return;}if(e.target.closest('button'))return;if(/^[1-7]$/.test(e.key)){go(scenes[Number(e.key)-1][0]);return;}if(state.mode!=='tui')return;if(state.tuiDetail){if(e.key==='Escape'){e.preventDefault();action('tui-close');}return;}if(state.scene==='journey'&&e.key.toLowerCase()==='i'){e.preventDefault();action('tui-details');return;}if(state.scene==='journey'&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();state.point=Math.max(0,Math.min(points.length-1,state.point+(e.key==='ArrowDown'?1:-1)));render();}else if(state.scene==='journey'&&e.key==='Enter'){go('restore');}else if(e.key==='Escape'){go(state.scene==='home'?'home':state.scene==='restore'?'journey':'home');}else if(e.key==='?'){toast('预览快捷键：1–7 切换页面；旅程页 ↑↓ 选时间点；Enter 查看恢复计划；Esc 返回。');}else{const key=e.key.toLowerCase(),map=state.scene==='home'?{a:'start',s:'servers',b:'locations'}:state.scene==='journey'?{b:'backup',r:'restore',f:'files',e:'export'}:state.scene==='start'?{n:'new-server',i:'adopt'}:state.scene==='health'?{c:'recheck'}:{};if(map[key]){e.preventDefault();action(map[key]);}}});
render();
</script>
