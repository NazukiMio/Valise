<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valise · 恢复流程草图</title>
<style>
:root{--paper:#f7f6f2;--side:#efede6;--card:#fff;--board:#f8f7f3;--ink:#302d29;--sub:#70695f;--line:#e2ded5;--gold:#84683e;--gold-soft:#f2e9da;--accent:#796b57;--on:#fff;--ok:#52765d;--warn:#8d571c;--warn-bg:#fcf3e4;--bad:#9d4540;--bad-bg:#fcf0ee;--shadow:0 3px 12px #372f2207;--focus:#886b3b}
:root[data-theme=dark]{--paper:#20201e;--side:#262622;--card:#2c2c28;--board:#252521;--ink:#eee9df;--sub:#bbb4a7;--line:#44433c;--gold:#d0b37c;--gold-soft:#3c3529;--accent:#bcaa8a;--on:#24231f;--ok:#a2c7aa;--warn:#e9bc7b;--warn-bg:#3a3024;--bad:#e5a5a0;--bad-bg:#3e2928;--focus:#dfbf84}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
button,a,select,input{outline-offset:4px}
:focus-visible{outline:2px solid var(--focus)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:44px;padding:8px 15px;font-size:13px;line-height:1.4}
button:hover{border-color:var(--gold);background:var(--gold-soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
button.quiet{background:transparent;border-color:transparent;color:var(--gold);padding-inline:3px}
button.danger{color:var(--bad);border-color:var(--bad)}
button.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
button:disabled{cursor:default;opacity:.6}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.3;letter-spacing:-.03em;font-weight:650}
h2{font-size:16px;font-weight:650}
h3{font-size:14px}
small,.muted{color:var(--sub);font-size:12px}
.review{padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.review strong{font-size:13px;color:var(--gold)}
.review .hint{font-size:12px;color:var(--sub)}
.review label{display:flex;gap:6px;align-items:center;font-size:12px}
.review select{max-width:230px;border:1px solid var(--line);background:var(--paper);border-radius:7px;min-height:36px;padding:4px 8px}
.review button{min-height:36px}
.space{flex:1}
.app{display:grid;grid-template-columns:204px minmax(0,1fr);min-height:calc(100vh - 98px)}
.sidebar{background:var(--side);padding:24px 14px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--line)}
.brand{font:600 23px/1.3 Georgia,"Songti SC",serif;padding:2px 10px;display:flex;gap:10px;align-items:center}
.brand span{color:var(--gold);font-size:25px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav div{padding:10px 13px;color:var(--sub);border-radius:8px;display:flex;gap:10px}
.nav .current{color:var(--ink);background:var(--card);font-weight:600}
.tagline{margin-top:auto;color:var(--sub);font-size:11px;padding:6px 10px}
main{min-width:0;padding:30px clamp(20px,3.5vw,54px);max-width:1400px;width:100%;margin:auto}
.crumb{color:var(--sub);font-size:12px;display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.crumb button{min-height:28px;font-size:12px;padding:1px 0}
.title{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.avatar{border:1px solid var(--line);background:var(--gold-soft);color:var(--gold);border-radius:16px;width:58px;height:58px;display:grid;place-items:center;font-size:24px;flex:none}
.title .muted{margin-top:5px;font-size:13px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.tabs{display:flex;gap:24px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:24px;color:var(--sub)}
.tabs b{border-bottom:2px solid var(--gold);color:var(--ink);padding-bottom:9px;margin-bottom:-10px}
.ticket{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 18px;background:var(--card);margin-bottom:24px;flex-wrap:wrap}
.ticket .date{font-size:18px;font-weight:650;letter-spacing:-.02em}
.ticket .sep{height:28px;width:1px;background:var(--line)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:2px 9px;color:var(--sub);width:max-content;max-width:100%}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 252px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card>h2{margin-bottom:12px}
.card>p+p{margin-top:9px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.source{display:flex;gap:12px;border-top:1px solid var(--line);padding:12px 0;align-items:center}
.source:first-child{border:0;padding-top:0}
.source:last-child{padding-bottom:0}
.source .icon{font-size:19px;color:var(--gold);width:25px;text-align:center;flex:none}
.source strong{font-size:13px}
.grow{flex:1;min-width:0}
.modegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:15px;min-height:128px;text-align:left;line-height:1.5}
.mode strong{font-size:14px}
.mode small{font-size:12px}
.ring{border:1.5px solid var(--sub);width:15px;height:15px;border-radius:50%}
.selected .ring{border:4px solid var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px 12px;min-height:44px}
.field input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;margin-top:8px;padding:12px}
.choice strong{font-size:13px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-child{border-top:0;padding-top:0}
.kv .key{color:var(--sub)}
.note{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--board);font-size:13px;line-height:1.7}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.note.warn strong{color:var(--warn)}
.note.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.note.bad strong{color:var(--bad)}
.note p+p{margin-top:6px}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px;margin-top:8px}
.actions .left{margin-right:auto}
.rail{position:sticky;top:20px;padding:3px 0 0}
.rail h3{font-size:12px;color:var(--sub);font-weight:500;margin-bottom:14px}
.step{display:flex;gap:12px;position:relative;padding-bottom:22px;font-size:12px;color:var(--sub)}
.step:before{content:'';width:1px;position:absolute;left:11px;top:25px;bottom:1px;background:var(--line)}
.step:last-of-type:before{display:none}
.step i{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;background:var(--paper)}
.step.now{color:var(--ink);font-weight:650}
.step.now i{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.step.done i{border-color:var(--ok);color:var(--ok)}
.rail .note{font-size:12px;margin-top:8px}
details{padding-top:10px;color:var(--sub);font-size:12px}
details summary{cursor:pointer;min-height:36px;display:list-item;align-content:center}
details .inside{padding:10px 0;font-size:12px}
.mono{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:10px 0}
.check input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--gold);flex:none}
.pick{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:9px;font-size:13px}
.pick input{margin-top:5px;accent-color:var(--gold)}
.phase{display:flex;gap:12px;border-top:1px solid var(--line);padding:14px 0;align-items:flex-start}
.phase:first-child{border-top:0;padding-top:0}
.dot{width:20px;height:20px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:11px;margin-top:2px}
.dot.ok{border-color:var(--ok);color:var(--ok)}
.dot.run{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.progress{height:5px;background:var(--line);border-radius:9px;margin-top:12px;overflow:hidden}
.progress span{display:block;background:var(--gold);height:100%;width:50%}
.summary{border-left:3px solid var(--gold);padding:2px 0 2px 17px;margin:18px 0 24px}
.summary h2{font-size:20px;font-weight:600;margin-bottom:4px}
.summary p{color:var(--sub);font-size:13px}
.resultrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start;font-size:13px}
.resultrow:first-child{border:0;padding-top:0}
.oktext{color:var(--ok)}
.warntext{color:var(--warn)}
.badtext{color:var(--bad)}
.globaltask{padding:11px 15px;margin-bottom:18px;border:1px solid var(--gold);border-radius:9px;background:var(--gold-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.globaltask button{min-height:32px;padding:4px 9px;background:transparent}
.error{color:var(--bad);font-size:13px;line-height:1.6}
.reviewnext{margin:14px 0 0;border:1px dashed var(--gold);color:var(--gold);padding:12px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.reviewnext button{min-height:36px;color:var(--gold)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:min(480px,calc(100vw - 32px));box-shadow:0 24px 70px #0002}
dialog::backdrop{background:#2227}
dialog p{font-size:13px;color:var(--sub);margin:12px 0 20px}
.dialogactions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.footer-note{font-size:11px;color:var(--sub);padding-top:24px;line-height:1.7}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s,box-shadow .12s}}
@media(max-width:1150px){.grid{grid-template-columns:minmax(0,1fr) 215px;gap:18px}.modegrid{grid-template-columns:1fr}.mode{min-height:0;display:grid;grid-template-columns:15px 1fr;column-gap:11px}.mode small{grid-column:2}.mode .ring{grid-row:1/3;margin-top:3px}}
@media(max-width:850px){.app{grid-template-columns:160px minmax(0,1fr)}.sidebar{padding-inline:8px}.grid{grid-template-columns:1fr}.rail{position:static;border-top:1px solid var(--line);padding-top:18px}.rail .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.step:before{display:none}.step{padding-bottom:7px;gap:7px}.review .space{display:none}h1{font-size:25px}.ticket .sep{display:none}}
@media(max-width:570px){.app{display:block}.sidebar{padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:20px;padding:0}.nav{flex-direction:row;gap:2px;flex-wrap:wrap}.nav div{font-size:12px;padding:6px 9px}.tagline{display:none}main{padding:22px 16px}.review{padding:12px 16px;gap:9px}.review .hint{width:100%}.review label{width:100%;justify-content:space-between}.review select{max-width:65%;width:65%}.card{padding:16px}.ticket{padding:12px 14px;gap:8px 14px}.title{gap:12px}.avatar{width:46px;height:46px;border-radius:13px}h1{font-size:23px}.ticket .date{font-size:16px}.kv{grid-template-columns:82px minmax(0,1fr)}.resultrow{grid-template-columns:20px minmax(0,1fr)}.resultrow .state{grid-column:2}.actions button.primary{width:100%}.actions .left{width:100%;text-align:left}.source{flex-wrap:wrap}.source .tag{margin-left:37px}.reviewnext{align-items:stretch}.reviewnext button{width:100%}}
</style>
</head>
<body>
<header class="review" aria-label="草图评审工具">
<strong>Valise / 恢复流程 · 待确认</strong><span class="hint">示例数据 · 不连接服务器 · 不收集口令</span><span class="space"></span>
<label>查看页面<select id="review-page">
<option value="point">① 时间点详情</option><option value="setup">② 用法与去处</option><option value="plan">③ 第一次确认</option><option value="stage">④ 准备与校验</option><option value="confirm">⑤ 第二次确认</option><option value="running">⑥ 交换与复核</option><option value="result">⑦ 操作结果</option><option value="reconcile">⑧ 断线后核实</option>
</select></label>
<label>示例情况<select id="review-case">
<option value="normal">正常</option><option value="unbound">来源身份不明</option><option value="untested">恢复未测试 / 快照资料</option><option value="conflict">副本记录冲突</option><option value="missing">缺少恢复材料</option><option value="named">命名实例</option><option value="expired">交换确认已过期</option><option value="lost">源失联（后续边界）</option>
</select></label>
<label>示例时间点<select id="review-tier"><option value="full">完整备份</option><option value="soul">轻装备份</option></select></label>
<button id="theme-toggle" aria-label="切换草图深浅色">深色</button>
</header>
<div class="app">
<aside class="sidebar" aria-label="示例导航">
<div class="brand"><span>♧</span>Valise</div>
<div class="nav"><div class="current">◇ 我的 Agent</div><div>▤ 服务器</div><div>▱ 备份位置</div><div>⚙ 设置</div></div>
<div class="tagline">带着你的 Agent 去旅行。</div>
</aside>
<main id="main"><div id="taskbar"></div><div id="screen"></div></main>
</div>
<dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialogactions"><button data-dialog-close>再看看</button><button id="dialog-confirm" class="primary">确认</button></div></dialog>
<script>
(function(){
'use strict';
const s={page:'point',mode:'rollback',source:'local',scenario:'normal',tier:'full',target:'ubuntu-vm-x86',instance:'openclaw-copy',root:'',sourceChoice:'',credential:false,profile:false,snapshotProfile:false,swap:false,active:false,result:'success',checkpoint:false,error:''};
const modes={
rollback:{title:'恢复当前实例',verb:'恢复',line:'用过去的状态恢复当前的“小满”，身份与旅程保留。',target:'ubuntu-vm · 小满',final:'确认替换并恢复'},
migrate:{title:'迁移到另一台服务器',verb:'迁移',line:'把这段旅程接到另一台服务器，原实例要先核实停用。',target:'另一台服务器',final:'确认停用原实例并迁移'},
clone:{title:'创建副本',verb:'创建副本',line:'建立一个独立的 Agent，原实例继续使用。',target:'另一台服务器 · 新实例',final:'确认创建副本'}
};
const sourceNames={server:'在服务器中 · ubuntu-vm',local:'本机 · 移动硬盘',cloud:'云盘 · 已配置云盘'};
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function button(text,action,kind){return '<button data-do="'+action+'" class="'+(kind||'')+'">'+text+'</button>';}
function go(text,page,kind){return '<button data-go="'+page+'" class="'+(kind||'')+'">'+text+'</button>';}
function tag(text,tone){return '<span class="tag '+(tone||'')+'">'+text+'</span>';}
function box(title,text,tone){return '<div class="note '+(tone||'')+'"><strong>'+title+'</strong><p>'+text+'</p></div>';}
function kv(key,value){return '<div class="kv"><span class="key">'+key+'</span><span>'+value+'</span></div>';}
function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>';}
function checked(v){return v?' checked':'';}
function check(field,text){return '<label class="check"><input type="checkbox" data-field="'+field+'"'+checked(s[field])+'><span>'+text+'</span></label>';}
function details(title,body){return '<details><summary>'+title+'</summary><div class="inside">'+body+'</div></details>';}
function crumb(){return '<div class="crumb">'+go('‹ 时间点详情','point','quiet')+'<span>/</span><span>小满 · 旅程</span></div>';}
function heading(title,sub){return crumb()+'<div class="title"><div class="avatar" aria-hidden="true">◇</div><div><h1>'+title+'</h1><p class="muted">'+sub+'</p></div></div>';}
function ticket(){return '<div class="ticket"><div><div class="date">2026 年 11 月 10 日 · 19:19</div><div class="muted">小满 · 原服务器 ubuntu-vm</div></div><span class="sep"></span>'+tag(s.tier==='full'?'完整备份':'轻装备份')+'<span class="muted">只使用这个时间点实际保存的内容</span></div>';}
function target(){return s.mode==='rollback'?'ubuntu-vm · 小满':esc(s.target)+(s.mode==='clone'?' · '+esc(s.instance):' · 小满');}
function rail(now){
const names=['选择去处','确认计划','准备并校验','确认替换','交换与复核','查看结果'];
return '<aside class="rail"><h3>这次操作</h3><div class="steps">'+names.map(function(n,i){return '<div class="step '+(i===now?'now':i<now?'done':'')+'"'+(i===now?' aria-current="step"':'')+'><i>'+(i<now?'✓':i+1)+'</i><span>'+n+'</span></div>';}).join('')+'</div>'+box(modes[s.mode].title,'从这个时间点恢复到<br><b>'+target()+'</b>')+'<p class="footer-note">来源位置与原服务器分开。<br>材料、暂存、服务和健康分别核实。</p></aside>';
}
function layout(body,step){return '<div class="grid"><div class="stack">'+body+'</div>'+rail(step)+'</div>';}
function actions(body){return '<div class="actions">'+body+'</div>';}
function hardBlock(){return ['conflict','missing','lost'].includes(s.scenario);}
function sourceNotice(){
if(s.scenario!=='unbound')return '';
const available=s.mode!=='clone';
return box('这个时间点的来源身份无法核实','备份里记着“小满”、ubuntu-vm、资料版本与保存时间，但这些信息不能证明它属于当前实例。请明确选择如何继续。','warn')+
(available?'<label class="pick"><input type="radio" name="source-choice" value="backup_first"'+checked(s.sourceChoice==='backup_first')+'><span><b>先备份当前状态再恢复</b><br><small>先给目标上的当前实例建立一次完整备份，失败就停下。</small></span></label>':'')+
'<label class="pick"><input type="radio" name="source-choice" value="proceed"'+checked(s.sourceChoice==='proceed')+'><span><b>我清楚，继续</b><br><small>确认使用这个时间点；不会因此补造身份关系。</small></span></label>';
}
function profileNotice(){
if(s.scenario!=='untested')return '';
return box('恢复尚未在此版本测试','这份资料缺少当前环境的恢复演练证据；可能无法重建程序、通过服务检查。它来自快照，未经当前客户端审核。两项允许须分别确认，不能绕过来源哈希或身份冲突。','warn')+
check('profile','我了解具体影响，仍使用恢复未测试的资料。')+
check('snapshotProfile','我已查看下方命令，同意使用快照中保存的这份资料。');
}
function credentialNotice(){
if(s.tier==='soul'){
return box('这个时间点没有凭据与工作区',s.mode==='rollback'?'当前实例中范围外的凭据、工作区等按回滚规则带入；不会把它们当作过去的状态。':'目标已有目录会按计划替换，原有凭据不会自动沿用。需要在原生界面重新完成登录。','warn');
}
const tail=s.mode==='clone'?'资料声明的独占凭据会被排除，原 Agent 的独占渠道不会自动转给副本。':'这会恢复备份里保存的凭据与配置。它们的内容不在这里展示。';
return box('这个时间点包含凭据',tail,'warn')+check('credential','我了解本次恢复包含凭据，并已确认下面列出的影响。');
}
function point(){

function result(){
const r=s.result;
let title=r==='success'?modes[s.mode].title+'已完成':r==='rolledback'?'这次没有完成，已退回原状态':r==='stopped'?'准备已停止，活动目录未改动':r==='held'?'暂存已保留，尚未替换':'数据已恢复，服务尚未启动';

function rr(mark,label,value,tone){return '<div class="resultrow"><span class="'+(tone||'')+'">'+mark+'</span><b>'+label+'</b><span class="state '+(tone||'')+'">'+value+'</span></div>';}

if(r==='success')rows=rr('✓','文件与暂存','校验通过','oktext')+rr('✓','目录交换','已完成','oktext')+rr('✓','服务启动命令','退出码 0','oktext')+rr('✓','服务实际状态','正在运行','oktext')+rr('✓','健康检查','本次检查通过','oktext')+rr('✓','身份与旅程',s.mode==='migrate'?'迁移接续已记录':s.mode==='clone'?'独立副本已记录':'当前实例世代保持','oktext');
else if(r==='rolledback')rows=rr('!','本次恢复','目标健康检查未通过','warntext')+rr('✓','退回恢复前目录','已核实','oktext')+rr('✓','原服务状态','已恢复到操作前状态','oktext')+rr('?','退回后的健康','尚未重新检查','warntext')+rr('—','成功迁移关系','没有生成');
else if(r==='files')rows=rr('✓','文件校验与目录交换','已完成','oktext')+rr('!','目标服务','尚未启动','warntext')+rr('?','健康检查','尚未通过','warntext')+rr('—','迁移关系','未宣称完整迁移成功');
else rows=rr('✓','停止 / 暂停结果','已核实','oktext')+rr('—','活动目录交换','没有执行')+rr('·','已产生的材料','保留，未自动清理')+rr('—','成功迁移关系','没有生成');

return heading(title,sub)+ticket()+layout(card('分别核实的结果',rows)+box('接下来',next,r==='success'?'':r==='rolledback'?'warn':'')+

const views={point:point,setup:setup,plan:plan,stage:stage,confirm:confirm,running:running,result:result,reconcile:reconcile};

function modal(title,text,fn){const d=document.getElementById('dialog');document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-text').textContent=text;document.getElementById('dialog-confirm').onclick=function(){d.close();fn();};d.showModal();}
function action(a){
if(a==='plan'){
if(s.mode==='clone'&&!/^[a-z0-9][a-z0-9-]{0,62}$/.test(s.instance)){s.error='副本标识请使用小写字母、数字和连字符。';render();return;}
if(s.scenario==='named'&&!s.root.startsWith('/')){s.error='请为命名实例明确填写目标上的绝对目录。';render();return;}
s.credential=false;s.profile=false;s.snapshotProfile=false;s.sourceChoice='';route('plan');return;
}
if(a==='prepare'){
if(hardBlock())return;
if(s.tier==='full'&&!s.credential){s.error='请先确认这次恢复包含凭据。';render();return;}
if(s.scenario==='unbound'&&!s.sourceChoice){s.error='来源身份无法核实，请明确选择如何处理。';render();return;}
if(s.scenario==='untested'&&(!s.profile||!s.snapshotProfile)){s.error='请分别确认恢复未测试与使用快照资料这两项。';render();return;}
route('stage');return;
}
if(a==='stage-ready'){s.swap=false;route('confirm');return;}
if(a==='stop-stage'){modal('停止准备？','会先核实停止结果。当前实例尚未改动，已经取回的缓存或暂存材料另行保留与说明。',function(){s.result='stopped';s.active=false;route('result');});return;}
if(a==='hold'){modal('暂不进行替换？','本次还没有交换活动目录。暂存材料保留，以后继续时重新核实；不会自动删除。',function(){s.result='held';s.active=false;route('result');});return;}
if(a==='revalidate'){s.scenario='normal';s.swap=false;route('confirm');return;}
if(a==='swap'){if(!s.swap){s.error='请先核对目标与影响，确认这次替换。';render();return;}s.active=true;route('running');return;}
if(a==='finish'){s.active=false;route('result');return;}
if(a==='disconnect'){s.active=false;s.checkpoint=false;route('reconcile');return;}
if(a==='query'){s.checkpoint=true;route('reconcile');return;}
if(a==='recover-back'){modal('按原操作记录退回？','仅执行当前记录允许的退回分支，核实目录与服务的实际结果，不重新建立一次恢复任务。',function(){s.result='rolledback';route('result');});return;}
if(a==='recover-continue'){modal('继续原来的操作？','重新核对这个操作、目标与允许的步骤后继续；不沿用过期确认，不重发已完成的步骤。',function(){s.active=true;route('running');});return;}
if(a==='technical'){modal('示例技术信息','正式产品在此展开实际操作编号、来源、路径、退出码及脱敏技术细节。本草图不连接服务器，不展示文件内容或秘密。',function(){});}
}
document.addEventListener('click',function(e){
if(e.target.closest('[data-dialog-close]')){document.getElementById('dialog').close();return;}
const mode=e.target.closest('[data-mode]');if(mode){s.mode=mode.dataset.mode;s.swap=false;s.error='';render();return;}
const source=e.target.closest('[data-source]');if(source){s.source=source.dataset.source;render();return;}
const b=e.target.closest('[data-go]');if(b){route(b.dataset.go);return;}
const a=e.target.closest('[data-do]');if(a)action(a.dataset.do);
});
document.addEventListener('input',function(e){
const f=e.target.dataset.field;if(!f)return;
s[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;

});
document.addEventListener('change',function(e){
if(e.target.name==='source-choice')s.sourceChoice=e.target.value;
if(e.target.id==='review-tier'){s.tier=e.target.value;s.credential=false;render();}
if(e.target.id==='outcome')s.result=e.target.value;
if(e.target.id==='review-page'){if(e.target.value==='result')s.active=false;route(e.target.value);}
if(e.target.id==='review-case'){s.scenario=e.target.value;s.error='';s.credential=false;s.profile=false;s.snapshotProfile=false;s.swap=false;if(s.scenario==='expired')s.page='confirm';else if(s.scenario!=='normal'&&s.scenario!=='named')s.page='plan';else if(s.scenario==='named')s.page='setup';render();}
});
document.getElementById('theme-toggle').onclick=function(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';this.textContent=d.dataset.theme==='dark'?'浅色':'深色';};
const initial=location.hash.slice(1);if(views[initial])s.page=initial;
render();
})();
</script>
</body>
</html>
