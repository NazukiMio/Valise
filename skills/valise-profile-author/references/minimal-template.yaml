# Starter Harness Profile Template (valise-profile/1)
# Passes `valise profiles lint --strict` with 0 errors and 0 warnings.
# Rules:
# - Keep status: draft until every verify: pending is resolved on a real host.
# - Annotate each rule with DOC: <url/page>, SRC: <file:symbol>, or OBS: <env/finding>.
# - Do NOT add deprecated checkup/handoff blocks in new profiles.
schema: valise-profile/1
id: example-harness
display_name: Example Harness
profile_version: 1
status: draft
harness_versions_tested: []
docs: https://example.com/docs

capabilities:
  install: { status: untested }
  manage: { status: untested }
  backup: { status: untested }
  restore: { status: untested, note: "恢复尚未在此版本演练" }
  login: { status: untested }
  kit: { status: untested }

detect:
  binaries: [example-harness]
  version_argv: [example-harness, --version]   # DOC: verify read-only, no network
  state_dir_candidates: ["${env:EXAMPLE_HOME}", "${HOME}/.example-harness"]
  markers_any: [config.yaml]

roots: []

paths:
  # Credentials whitelist (highest priority; must never overlap body/cache/ignore)
  - { root: state, glob: ".env", category: secrets, verify: pending }
  # Core user state & configuration (put specific rules before broader globs)
  - { root: state, glob: "config.yaml", category: config }
  - { root: state, glob: "MEMORY.md", category: memory, verify: pending }
  - { root: state, glob: "skills/**", category: skills, verify: pending }
  - { root: state, glob: "sessions/**", category: sessions, verify: pending }
  # High-confidence regenerable cache/ignore only; leave uncertain files unclassified for full fallback
  - { root: state, glob: "cache/**", category: cache, verify: pending }

exclusive_secrets: []

consistency:
  sqlite: []
  quiesce: none

provenance:
  kind: binary
  binary: { name: example-harness }

body:
  # Every body.paths[].glob MUST be "<literal-dir>/**" (e.g. "runtime/**").
  # Do NOT duplicate body.paths entries under paths with category: body.
  paths: []
  bootstrap_argv: []
  fresh_install_doc: https://example.com/docs/install

relocation: null

service:
  candidates: []
  # Include doc/source-verified install_argv / repair_action marked verify: pending when applicable:
  # install_argv: [example-harness, gateway, install]   # verify: pending
  # repair_action: restart

# Do NOT omit doc/source-verified localhost web UI ports (entries), onboarding/session CLI,
# or safe starter actions (status/restart/doctor) — write them in with verify: pending so
# users get usable interactive entries immediately after importing.
entries: []

health:
  grace_seconds: 15
  checks: []

# native_cli: [example-harness, setup]           # verify: pending
# native_session_cli: [example-harness, chat]    # verify: pending

# actions:
#   - id: status
#     name: 查看服务状态
#     explain: "查看后台服务运行状态"
#     risk: read
#     argv: [example-harness, status]            # verify: pending
#     output: text

login: []
